# OpenShell policy for the Hermes sandbox, baked at /etc/openshell/policy.yaml.
# Anything not allowed here is denied. The model route (Switchyard, :4000) and
# the receipt API (:8000) come from the provider profiles in
# infra/openshell/providers/, which OpenShell adds to the effective policy when
# the sandbox is created with --provider.
version: 1

filesystem_policy:
  include_workdir: true  # /sandbox
  read_only: [/opt/hermes, /opt/agent]  # patched Hermes; skills and tool registry
  read_write: [/opt/data]  # HERMES_HOME
  # OpenShell adds its baseline system paths (/usr, /lib, /etc, /proc, /tmp, ...).

landlock:
  compatibility: hard_requirement

# Every rule applies only to the Hermes interpreter: the real path of
# /opt/hermes/.venv/bin/python, which agent/Dockerfile asserts at build time.
# Each MCP endpoint allows the handshake plus an explicit tool allowlist.
network_policies:
  retrieval_mcp:
    name: Document retrieval MCP
    endpoints:
      - host: host.openshell.internal
        port: 8120
        path: /mcp
        protocol: mcp
        mcp: { versions: ["2025-11-25"] }
        enforcement: enforce
        rules:
          - allow: { method: initialize }
          - allow: { method: notifications/initialized }
          - allow: { method: tools/list }
          - allow: { method: ping }
          - allow: { method: tools/call, tool: retrieve_evidence }
    binaries: &hermes
      - path: /usr/bin/python3.13

  market_analytics_mcp:
    name: Market analytics MCP
    endpoints:
      - host: host.openshell.internal
        port: 3010
        path: /mcp
        protocol: mcp
        mcp: { versions: ["2025-11-25"] }
        enforcement: enforce
        rules:
          - allow: { method: initialize }
          - allow: { method: notifications/initialized }
          - allow: { method: tools/list }
          - allow: { method: ping }
          - allow:
              method: tools/call
              tool:
                any:
                  - market_scan
                  - market_anomaly_scan
                  - price_context
                  - sentiment_timeline
                  - analyze_news_price_relationship
                  - analyze_market_relationships
                  - intraday_scan
                  - predict_asset_outcomes
    binaries: *hermes

  auto_ontology_mcp:
    name: Auto Ontology MCP
    endpoints:
      - host: host.openshell.internal
        port: 3003
        path: /mcp
        protocol: mcp
        mcp: { versions: ["2025-11-25"] }
        enforcement: enforce
        rules:
          - allow: { method: initialize }
          - allow: { method: notifications/initialized }
          - allow: { method: tools/list }
          - allow: { method: ping }
          - allow: { method: tools/call, tool: ask_question }
    binaries: *hermes

  phoenix_otlp:
    name: Relay traces to Phoenix
    endpoints:
      - host: host.openshell.internal
        port: 6006
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/traces }
    binaries: *hermes
