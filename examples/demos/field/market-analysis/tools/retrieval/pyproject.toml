[project]
name = "demo-retrieval"
version = "0.1.0"
description = "retrieve_evidence MCP server: NVIDIA Nemotron embed + rerank over Milvus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The NVIDIA clients' transports; retries tell their transient errors apart.
    "aiohttp>=3.14.3",
    # Exact pin: the next release turns usage telemetry on by default; 1.4.3 is also the GHSA-g28h-2cmm-rj9x floor.
    "langchain-nvidia-ai-endpoints==1.4.3",
    "langchain-text-splitters>=1.1.2,<2",
    "mcp>=2.2,<3",
    # retrieval-benchmark's exact neighbors and normalized vectors
    "numpy>=2.3,<3",
    "openinference-semantic-conventions>=0.1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    # Same 2.6 line as the Milvus server (milvusdb/milvus:v2.6.x).
    "pymilvus>=2.6.17,<2.7",
    "requests>=2.34.2",
    "tenacity>=9.1",
]

[project.scripts]
demo-retrieval = "demo_retrieval.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
