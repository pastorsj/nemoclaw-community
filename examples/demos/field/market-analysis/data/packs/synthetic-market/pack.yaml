#
# A fictional US equity market made with NeMo Data Designer, in the same format as the real-data pack: the
# generator writes a raw market dataset (bars, companies, ticker-linked news) and demo-data imports it with the
# same importer. SEC EDGAR filings and eCFR Title 17 are separate, real document sources for retrieval.
# See README.md for the data card and ../../README.md for the format.
schema_version: "2"
id: synthetic-market
version: "1.0.0"
title: Synthetic US Equities
description: >-
  Fictional US-listed issuers with seeded prices and ticker-linked company news written by Nemotron through NeMo
  Data Designer, beside real SEC EDGAR 8-K/6-K filings (2026 Q2) and eCFR Title 17 as separate document sources.
as_of: "2026-08-31"
disclaimer: >-
  Synthetic market data for a software demonstration: every issuer, price and news item is fictional. Not
  investment advice.

licenses:
  - name: Apache-2.0
    path: https://www.apache.org/licenses/LICENSE-2.0
    redistribution: allowed
    notes: The generated market data and its Nemotron-written text are synthetic demonstration assets.
  - name: US-Government-Public-Information
    title: United States government public information
    path: https://www.govinfo.gov/about/policies
    redistribution: allowed
    notes: The eCFR is authoritative current regulatory information but is not the official legal edition of the CFR.
  - name: SEC-EDGAR-Reuse
    title: SEC website information reuse terms
    path: https://www.sec.gov/about/webmaster-frequently-asked-questions
    redistribution: unknown
    notes: >-
      Filings are fetched from EDGAR at prepare time and never committed. Issuer-authored content may carry
      separate rights.

provenance:
  - id: synthetic-market-generator
    title: Synthetic market (seeded numbers; Nemotron text written with NeMo Data Designer)
    kind: generated
    synthetic: true
    license: Apache-2.0
    as_of: "2026-08-31"
    notes: >-
      Prices, volumes and news timing come from seeded samplers (generator/build.py, generator/model.yaml). Company
      names, profiles and headlines come from text/, written by `demo.sh data generate`. No name or ticker matches
      an issuer in SEC's ticker lists (text/checks.json).
  - id: ecfr-title-17
    title: Electronic Code of Federal Regulations, Title 17 (versioned API snapshot)
    kind: download
    synthetic: false
    license: US-Government-Public-Information
    url: https://www.ecfr.gov/api/versioner/v1/full/2026-08-17/title-17.xml
    as_of: "2026-08-17"
    retrieved_on: "2026-09-22"
  - id: federal-register-2023-16194
    title: >-
      SEC final rule, Cybersecurity Risk Management, Strategy, Governance, and Incident Disclosure (88 FR 51896),
      Federal Register XML
    kind: download
    synthetic: false
    license: US-Government-Public-Information
    url: https://www.federalregister.gov/documents/full_text/xml/2023/08/04/2023-16194.xml
    as_of: "2023-08-04"
    retrieved_on: "2026-10-01"
    notes: >-
      The rule's summary and its appendices of amended form text: Form 8-K General Instruction B.1 and Item 1.05,
      Form 10-K Item 1C, Form 20-F Item 16K and Form S-3. The preamble's discussion is left out.
  - id: sec-edgar-2026-q2
    title: SEC EDGAR 2026 Q2 master index and 1,000 sampled 8-K/6-K filings
    kind: download
    synthetic: false
    license: SEC-EDGAR-Reuse
    url: https://www.sec.gov/Archives/edgar/full-index/2026/QTR2/master.idx
    as_of: "2026-06-30"
    retrieved_on: "2026-09-22"
    requires_env: [SEC_USER_AGENT]

# The scale knob: issuers, the date window and the bar frequency. Every profile reads the first `issuers` rows
# of the committed text, so an issuer is the same company with the same prices in every profile. `large` needs
# more text than is committed: `demo.sh data generate --profile large` extends text/ first (README.md).
generator:
  entrypoint: generator/build.py
  default_profile: standard
  profiles:
    ci:
      description: 12 issuers, June to August 2026 (64 sessions), 300,288 1-minute bars; builds in seconds, for tests.
      params: { issuers: 12, start: "2026-06-01", end: "2026-08-31", frequency: 1min }
      expected_rows: { assets: 12, daily_prices: 768 }
    interactive:
      description: 50 issuers from 2025-01-02 (daily bars); builds in seconds.
      params: { issuers: 50, start: "2025-01-02", end: "2026-08-31", frequency: 1d }
      expected_rows: { assets: 50, daily_prices: 20800 }
    standard:
      description: 2,000 issuers from 2024-01-02 (1,336,000 daily bars); the scale the GPU analytics are shown at.
      params: { issuers: 2000, start: "2024-01-02", end: "2026-08-31", frequency: 1d }
      expected_rows: { assets: 2000, daily_prices: 1336000 }
    intraday:
      description: 500 issuers, March to August 2026, 24,828,500 1-minute bars, rolled up to daily.
      params: { issuers: 500, start: "2026-03-02", end: "2026-08-31", frequency: 1min }
      expected_rows: { assets: 500, daily_prices: 63500 }
    large:
      description: 10,000 issuers from 2016-01-04 (26.8 million daily bars); needs `data generate --profile large`.
      params: { issuers: 10000, start: "2016-01-04", end: "2026-08-31", frequency: 1d }
      expected_rows: { assets: 10000, daily_prices: 26800000 }

# The generator's raw dataset goes through the same importer as a real one (docs/data-platform.md#import).
market:
  bars:
    dataset: synthetic-market-generator
    files: bars/*/*.parquet
    symbol_column: symbol
    columns: { time: time, open: open, high: high, low: low, close: close, volume: volume }
    # The 1min profiles write one bar a minute; the others write one bar a session, stamped at the 16:00 close.
    # The rollup keeps both unchanged: it reads the regular session, both ends included.
    frequency: 1min
    timezone: America/New_York
    regular_session: ["09:30", "16:00"]
  companies: companies.parquet
  news: news.parquet
  exclude: []
  min_sessions: 20
  peers: 8

structured:
  source: market_data
  database_name: synthetic_market
  schema: schema.sql
  views: [views/prediction.sql]
  tables:
    - { name: assets, origin: synthetic-market-generator }
    - { name: ticker_history, origin: synthetic-market-generator }
    - { name: trading_sessions, origin: synthetic-market-generator }
    - { name: daily_prices, origin: synthetic-market-generator }
    - { name: asset_relationships, origin: synthetic-market-generator }
    - { name: company_news, origin: synthetic-market-generator }

documents:
  collection: synthetic_market_documents
  corpora:
    - source: sec_filings
      origin: sec-edgar-2026-q2
      format: edgar-filings
      manifest: corpus/sec-edgar-2026-q2.manifest.json
    - source: market_regulations
      origin: ecfr-title-17
      format: ecfr-xml
      manifest: corpus/ecfr-title17-2026-08-17.manifest.json
    # The CFR does not hold the SEC forms' text, so Form 8-K's Item 1.05 and its deadline come from the rule that
    # adopted them.
    - source: market_regulations
      origin: federal-register-2023-16194
      format: federal-register-xml
      manifest: corpus/fr-2023-16194.manifest.json
  # Held-out queries for the Benchmark tab's CPU/GPU Milvus index comparison (analytics-gpu profile): never
  # the demo questions. A build keeps those whose sources it indexed (docs/retrieval.md).
  benchmark_queries:
    - query: departure of a chief financial officer and the appointment of a successor
      sources: [sec_filings]
    - query: entry into a material definitive credit agreement with a syndicate of lenders
      sources: [sec_filings]
    - query: results of the annual meeting of shareholders and the votes on director elections
      sources: [sec_filings]
    - query: completion of an acquisition or disposition of a business
      sources: [sec_filings]
    - query: press release announcing quarterly financial results furnished as an exhibit
      sources: [sec_filings]
    - query: amendments to the articles of incorporation or bylaws
      sources: [sec_filings]
    - query: beneficial ownership report after acquiring more than five percent of a class of equity securities
      sources: [market_regulations]
    - query: management's assessment of internal control over financial reporting
      sources: [market_regulations]
    - query: net capital requirements for brokers and dealers
      sources: [market_regulations]
    - query: locating securities to borrow before effecting a short sale
      sources: [market_regulations]
    - query: conditions for resales of restricted securities under the safe harbor
      sources: [market_regulations]
    - query: disclosure of executive compensation in proxy statements
      sources: [market_regulations]
    - query: disclosure of a material cybersecurity incident and the timing of the report
      sources: [sec_filings, market_regulations]
    - query: share repurchase program authorizations and the rules for issuer repurchases
      sources: [sec_filings, market_regulations]
    - query: changes in a registrant's certifying accountant
      sources: [sec_filings, market_regulations]

sources:
  - id: market_data
    name: Market Prices & Company News
    description: >-
      Synthetic prices, volumes, peers and ticker-linked company news for fictional US-listed issuers, in DuckDB.
    agent_description: >-
      Analyze synthetic market history and ticker-linked company news through native market analytics, Auto
      Ontology and prediction. Every issuer, price and news item is fictional.
    kind: structured
    capabilities: [structured_retrieval, structured_prediction, market_analytics]
    synthetic: true
    example_questions:
      - Which of the 12 most liquid issuers led returns over the latest 20 trading sessions?
      - How did company news sentiment line up with the following sessions' returns?
      - Which sessions were most unusual in return, volatility and volume?
  - id: sec_filings
    name: SEC Filings
    description: >-
      Real SEC EDGAR 8-K and 6-K filings from 2026 Q2, retrieved from Milvus with NVIDIA Nemotron Embed and Rerank.
    agent_description: >-
      Retrieve citation-ready public-company current reports from the reviewed SEC EDGAR 2026 Q2 snapshot. These
      are real filers, not the fictional issuers in market_data.
    kind: documents
    capabilities: [unstructured_retrieval]
    synthetic: false
    example_questions:
      - Which second-quarter 2026 current reports describe a material cybersecurity incident?
  - id: market_regulations
    name: Market Regulations
    description: >-
      Current public eCFR Title 17 sections and the SEC's 2023 cybersecurity disclosure rule, retrieved from
      Milvus with NVIDIA Nemotron Embed and Rerank.
    agent_description: >-
      Retrieve citation-ready sections from the reviewed eCFR Title 17 snapshot for securities and commodities
      regulation research, and the form text the SEC's 2023 cybersecurity disclosure rule adopted (Form 8-K Item
      1.05 and its filing deadline, Form 10-K Item 1C), which the CFR does not hold.
    kind: documents
    capabilities: [unstructured_retrieval]
    synthetic: false
    example_questions:
      - What must a company disclose about a material cybersecurity incident, and when?

analytics:
  contract: market-analytics/v1
  news_table: company_news
  session_close_utc: "21:00"
  universes:
    top_12:
      description: The 12 most liquid issuers by median daily dollar volume; each has one planted news story.
      where: liquidity_rank <= 12
    all_assets:
      description: Every issuer in the pack.
      where: "true"
  relationship_graph:
    window_start: "2026-06-01"
    window_end: "2026-08-31"
    mode_by_profile:
      ci: full_correlation
      interactive: full_correlation
      standard: sparse_declared_peers
      intraday: sparse_declared_peers
      large: sparse_declared_peers

prediction:
  schema: prediction
  anchor: "2026-08-24T21:00:00+00:00"
  horizon_sessions: 5
  entity: { table: asset_entities, key: asset_id }
  population: { view: top_12_population }
  tables:
    asset_entities: { primary_key: asset_id }
    price_events: { primary_key: price_id, time_column: observed_at, links_to_entity: asset_id }
    news_events: { primary_key: news_id, time_column: published_at, links_to_entity: asset_id }
    return_outcomes: { primary_key: outcome_id, time_column: realized_at, links_to_entity: asset_id }
  forbidden_tables: [daily_prices, company_news]
  templates:
    - id: positive_return
      name: Positive five-session return
      description: >-
        Rank the 12 most liquid issuers by likelihood of a positive five-session adjusted-close return realized
        within 5 calendar days after the anchor.
      pql: >-
        PREDICT COUNT(return_outcomes.* WHERE return_outcomes.positive_return = true, 0, 5, days) > 0
        FOR EACH asset_entities.asset_id
    - id: material_downside
      name: Material five-session downside
      description: >-
        Rank the 12 most liquid issuers by likelihood of a five-session adjusted-close return below negative five
        percent realized within 5 calendar days after the anchor.
      pql: >-
        PREDICT COUNT(return_outcomes.* WHERE return_outcomes.forward_return_5d < -0.05, 0, 5, days) > 0
        FOR EACH asset_entities.asset_id
    - id: news_event
      name: Company news arrival
      description: >-
        Rank the 12 most liquid issuers by likelihood of new company news within 5 calendar days after the anchor.
      pql: PREDICT COUNT(news_events.*, 0, 5, days) > 0 FOR EACH asset_entities.asset_id

ontology: ontology.yaml
questions: questions.yaml
