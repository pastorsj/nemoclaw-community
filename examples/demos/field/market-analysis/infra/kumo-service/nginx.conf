# The Kumo service's proxy (docs/kumo-service.md), mounted as /etc/nginx/conf.d/default.conf (http context).
# keys.sh writes the two files under /tmp/kumo-service before nginx starts.

server_tokens off;

# Docker's DNS, so the NIM's address is looked up per request: the proxy starts before the NIM, and follows it
# when it is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Per client address: KUMO_SERVICE_REAL_IP_FROM names the link's proxy, whose X-Forwarded-For then gives it.
limit_req_zone $binary_remote_addr zone=kumo_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=kumo_conn:10m;

# A 64-character key (openssl rand -hex 32) needs a larger map bucket than the default 64 bytes.
map_hash_bucket_size 128;

# 1 when X-API-Key is one of the accepted keys, matched whole and case-sensitively.
map $http_x_api_key $kumo_authorized {
    default 0;
    include /tmp/kumo-service/keys.map;
}

# No header and no query string, so no key, reaches the log.
log_format kumo '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status '
                'in=$request_length out=$body_bytes_sent ${request_time}s';

server {
    listen 8080;
    server_name _;
    include /tmp/kumo-service/real-ip.conf;
    access_log /dev/stdout kumo;

    # Before the key check (access phase), so wrong keys are rate limited too.
    limit_req zone=kumo_rate burst=40 nodelay;
    limit_req_status 429;
    limit_conn kumo_conn 16;
    limit_conn_status 429;

    # A prediction request carries the sampled graph as JSON: about 9.3 MB for synthetic-market, measured
    # with the demo's client. The body streams to the NIM as it arrives.
    client_max_body_size 64m;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 300s;

    set $kumo_upstream http://kumo-relational:8000;

    error_page 401 = @unauthorized;

    # Readiness, without a key: the NIM's own health check.
    location = /healthz {
        proxy_pass $kumo_upstream/v1/health/ready;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        auth_request /_kumo_auth;
        proxy_pass $kumo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-API-Key ""; # the NIM never sees the key
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /_kumo_auth {
        internal;
        if ($kumo_authorized) {
            return 204;
        }
        return 401;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error": "missing or invalid X-API-Key"}\n';
    }
}
