# Tools whose destination is chosen at run time, allow lists that admit nothing,
# and malformed tools.
component_type: Agent
id: web-reader
name: Web Reader
description: Reads documentation pages.
metadata: {}
inputs: []
outputs: []
llm_config:
  component_type: OpenAiConfig
  id: gpt
  name: gpt-5
  description: null
  metadata: {}
  model_id: gpt-5
  api_type: responses
  url: https://proxy.example.com/v1
tools:
# Templated host: one need per admissible allow-list entry. The http entry can
# never match, because the URL always uses https.
- component_type: RemoteTool
  id: fetch-doc
  name: fetch_doc
  description: null
  metadata: {}
  url: https://{{host}}/api/{{page}}
  http_method: GET
  url_allow_list:
  - https://docs.example.com/api/
  - https://intranet.example.com:8443
  - http://legacy.example.com/
- component_type: RemoteTool
  id: fetch-any-url
  name: fetch_any_url
  description: Fetch any URL the model chooses.
  metadata: {}
  url: "{{url}}"
  http_method: GET
- component_type: RemoteTool
  id: fetch-port
  name: fetch_port
  description: null
  metadata: {}
  url: https://status.example.com:{{port}}/health
  http_method: GET
- component_type: RemoteTool
  id: local-inventory
  name: local_inventory
  description: null
  metadata: {}
  url: http://127.0.0.1:INVENTORY_PORT/stock/{{sku}}
  http_method: GET
- component_type: RemoteTool
  id: blocked-tool
  name: blocked_tool
  description: null
  metadata: {}
  url: https://api.example.com/orders
  http_method: GET
  url_allow_list: []
- component_type: RemoteTool
  id: wrong-prefix
  name: wrong_prefix
  description: null
  metadata: {}
  url: https://api.example.com/orders/{{order_id}}
  http_method: GET
  url_allow_list:
  - https://api.example.com/customers/
- component_type: RemoteTool
  id: all-invalid
  name: all_invalid
  description: null
  metadata: {}
  url: https://{{region}}.api.example.com/v1/items
  http_method: GET
  url_allow_list:
  - not a url
  - 42
- component_type: RemoteTool
  id: no-method
  name: no_method
  description: null
  metadata: {}
  url: https://api.example.com/health
- component_type: RemoteTool
  id: bad-method
  name: bad_method
  description: null
  metadata: {}
  url: https://api.example.com/health
  http_method:
  - GET
agentspec_version: 26.2.0
