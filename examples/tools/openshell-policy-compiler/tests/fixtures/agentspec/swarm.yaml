# A swarm with remote agents, datastores, a built-in tool, and plugin components.
component_type: Swarm
id: support-swarm
name: Support Swarm
description: Handles customer support requests.
metadata: {}
inputs: []
outputs: []
first_agent:
  $component_ref: triage
relationships:
- - $component_ref: triage
  - component_type: A2AAgent
    id: billing-agent
    name: billing agent
    description: Handles billing questions.
    metadata: {}
    inputs: []
    outputs: []
    agent_url: https://agents.example.com/a2a/billing
    connection_config:
      timeout: 30.0
      headers:
        Authorization: Bearer {{billing_token}}
      verify: true
    session_parameters:
      timeout: 60.0
      poll_interval: 2.0
      max_retries: 3
- - $component_ref: triage
  - component_type: A2AAgent
    id: shipping-agent
    name: shipping agent
    description: null
    metadata: {}
    inputs: []
    outputs: []
    agent_url: http://10.0.0.5:9000
    connection_config:
      component_type: A2AConnectionConfig
      id: shipping-connection
      name: shipping connection
      description: null
      metadata: {}
      timeout: 30.0
      verify: false
- - $component_ref: triage
  - component_type: OciAgent
    id: oci-agent
    name: oci agent
    description: null
    metadata: {}
    inputs: []
    outputs: []
    agent_endpoint_id: AGENT_ENDPOINT
    client_config:
      component_type: OciClientConfigWithApiKey
      id: oci-agent-client
      name: oci agent client
      description: null
      metadata: {}
      service_endpoint: https://agent.generativeai.us-chicago-1.oci.oraclecloud.com
      auth_type: API_KEY
      auth_profile: DEFAULT
      auth_file_location:
        $component_ref: oci-agent-client.auth_file_location
handoff: optional
$referenced_components:
  openai-llm:
    component_type: OpenAiConfig
    id: openai-llm
    name: openai
    description: null
    metadata: {}
    model_id: gpt-4o
    api_key:
      $component_ref: openai-llm.api_key
  triage:
    component_type: Agent
    id: triage
    name: triage
    description: null
    metadata: {}
    inputs: []
    outputs: []
    llm_config:
      $component_ref: openai-llm
    system_prompt: Route the request.
    transforms:
    - component_type: MessageSummarizationTransform
      id: summarizer
      name: summarizer
      description: null
      metadata: {}
      llm:
        $component_ref: openai-llm
      datastore:
        component_type: PostgresDatabaseDatastore
        id: summary-cache
        name: summary cache
        description: null
        metadata: {}
        datastore_schema: {}
        connection_config:
          component_type: TlsPostgresDatabaseConnectionConfig
          id: pg-tls
          name: pg tls
          description: null
          metadata: {}
          user:
            $component_ref: pg-tls.user
          password:
            $component_ref: pg-tls.password
          url: postgresql://db.internal.example.com:6543/agent
          sslmode: require
    - component_type: ConversationSummarizationTransform
      id: conversation-summarizer
      name: conversation summarizer
      description: null
      metadata: {}
      llm:
        $component_ref: openai-llm
      datastore:
        component_type: OracleDatabaseDatastore
        id: oracle-cache
        name: oracle cache
        description: null
        metadata: {}
        datastore_schema: {}
        connection_config:
          component_type: TlsOracleDatabaseConnectionConfig
          id: oracle-tls
          name: oracle tls
          description: null
          metadata: {}
          user:
            $component_ref: oracle-tls.user
          password:
            $component_ref: oracle-tls.password
          dsn:
            $component_ref: oracle-tls.dsn
          protocol: tcps
    tools:
    - component_type: BuiltinTool
      id: code-interpreter
      name: code_interpreter
      description: Runs Python code.
      metadata: {}
      inputs: []
      outputs: []
      tool_type: code_interpreter
      executor_name: orchestrator_builtin
    - component_type: MyCustomComponent
      component_plugin_name: MyCustomComponentPlugin
      component_plugin_version: 1.2.3.4
      id: custom
      name: My custom component
      metadata: {}
      extra_field1: "..."
agentspec_version: 26.3.1
