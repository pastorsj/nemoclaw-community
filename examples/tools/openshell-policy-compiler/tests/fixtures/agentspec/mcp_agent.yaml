# MCP tools and toolboxes over each transport kind.
component_type: Agent
id: mcp-agent
name: MCP Agent
description: Uses MCP servers.
metadata: {}
inputs: []
outputs: []
llm_config:
  component_type: OllamaConfig
  id: local-llama
  name: local-llama
  description: null
  metadata: {}
  url: localhost:11434
  model_id: llama3.3
system_prompt: Use the tools at your disposal.
tools:
- component_type: MCPTool
  id: get-weather
  name: get_weather
  description: Get the weather for a city.
  metadata: {}
  inputs: []
  outputs: []
  client_transport:
    component_type: StreamableHTTPTransport
    id: weather-transport
    name: weather transport
    description: null
    metadata: {}
    url: https://weather.example.com/mcp
    headers: null
toolboxes:
- component_type: MCPToolBox
  id: github-mcp
  name: GitHub MCP
  description: Read code through the GitHub MCP server.
  metadata: {}
  client_transport:
    component_type: StreamableHTTPTransport
    id: github-transport
    name: github transport
    description: null
    metadata: {}
    url: https://api.githubcopilot.com/mcp/
    headers: null
    sensitive_headers:
      $component_ref: github-transport.sensitive_headers
  tool_filter:
  - get_file_contents
  - component_type: MCPToolSpec
    id: search-code
    name: search_code
    description: null
    metadata: {}
    inputs: []
    outputs: []
    requires_confirmation: true
- component_type: MCPToolBox
  id: inventory
  name: Inventory MCP
  description: null
  metadata: {}
  client_transport:
    component_type: SSETransport
    id: inventory-transport
    name: inventory transport
    description: null
    metadata: {}
    session_parameters:
      read_timeout_seconds: 30.0
    url: http://localhost:9090/sse
    headers: null
  tool_filter: null
- component_type: MCPToolBox
  id: filesystem
  name: Filesystem MCP
  description: null
  metadata: {}
  client_transport:
    component_type: StdioTransport
    id: filesystem-transport
    name: filesystem transport
    description: null
    metadata: {}
    command: npx
    args:
    - -y
    - "@modelcontextprotocol/server-filesystem"
    - /workspace
  tool_filter:
  - read_file
- component_type: MCPToolBox
  id: secure
  name: Secure MCP
  description: null
  metadata: {}
  client_transport:
    component_type: StreamableHTTPmTLSTransport
    id: secure-transport
    name: secure transport
    description: null
    metadata: {}
    url: https://mcp.secure.example.com:8443/mcp
    headers: null
    key_file:
      $component_ref: secure-transport.key_file
    cert_file:
      $component_ref: secure-transport.cert_file
    ca_file:
      $component_ref: secure-transport.ca_file
  tool_filter:
  - lookup
- component_type: MCPToolBox
  id: oauth
  name: OAuth MCP
  description: null
  metadata: {}
  client_transport:
    component_type: StreamableHTTPTransport
    id: tickets-transport
    name: tickets transport
    description: null
    metadata: {}
    url: https://mcp.tickets.example.net/mcp
    headers: null
    auth:
      component_type: OAuthConfig
      id: tickets-oauth
      name: tickets oauth
      description: null
      metadata: {}
      issuer: https://auth.tickets.example.net
      redirect_uri: http://localhost:7777/callback
      scopes:
      - tickets.read
      client:
        component_type: OAuthClientConfig
        id: tickets-client
        name: tickets client
        description: null
        metadata: {}
        type: pre_registered
        client_id:
          $component_ref: tickets-client.client_id
        client_secret:
          $component_ref: tickets-client.client_secret
        client_id_metadata_url:
          $component_ref: tickets-client.client_id_metadata_url
  tool_filter:
  - open_ticket
agentspec_version: 26.2.0
