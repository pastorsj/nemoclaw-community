# The main configuration of a disaggregated agent. The LLM configuration, the
# client tool, and the pull-request URL live in disaggregated_components.json.
component_type: Agent
id: release-notes-agent
name: Release Notes Writer
description: null
metadata: {}
inputs: []
outputs: []
llm_config:
  $component_ref: staging_llm
system_prompt: Draft release notes from the merged pull requests.
tools:
- $component_ref: confirm_draft_tool
- $component_ref: pulls_tool
- $component_ref: absent_tool
$referenced_components:
  pulls_tool:
    component_type: RemoteTool
    id: pulls_tool
    name: list_merged_pulls
    description: List the merged pull requests of a repository.
    metadata: {}
    inputs: []
    outputs: []
    url:
      $component_ref: pulls_url
    http_method: GET
agentspec_version: 26.2.0
