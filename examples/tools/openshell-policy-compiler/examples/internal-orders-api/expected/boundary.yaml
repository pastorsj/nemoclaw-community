# Generated by policy-compiler 0.1.0 for Order Status Assistant. Review before use.
# Boundary (ceiling): the same capabilities without resource scope.
version: 1
network_policies:
  openshell_inference_local:
    name: openshell_inference_local
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/bin/python3
  acme_orders_internal_example:
    name: acme_orders_internal_example
    endpoints:
      - host: orders.internal.example
        port: 443
        protocol: rest
        enforcement: enforce
        allowed_ips:
          - 10.20.0.0/16
        rules:
          - allow:
              method: GET
              path: /v1/orders/*
          - allow:
              method: POST
              path: /v1/orders/search
          - allow:
              method: GET
              path: /v1/orders
    binaries:
      - path: /usr/bin/python3
