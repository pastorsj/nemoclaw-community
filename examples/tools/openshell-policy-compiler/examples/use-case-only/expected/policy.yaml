# Generated by policy-compiler 0.1.0 for understand-openshell. Review before use.
version: 1
network_policies:
  github_rest:
    name: github_rest
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/languages
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/contents/**
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/readme
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/commits
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/commits/*
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/git/trees/*
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/tarball/*
    binaries:
      - path: /usr/bin/python3
  github_raw:
    name: github_raw
    endpoints:
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /NVIDIA/OpenShell/*/**
    binaries:
      - path: /usr/bin/python3
  github_codeload:
    name: github_codeload
    endpoints:
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /NVIDIA/OpenShell/legacy.tar.gz/**
    binaries:
      - path: /usr/bin/python3
  github_git:
    name: github_git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /NVIDIA/OpenShell.git/info/refs
          - allow:
              method: POST
              path: /NVIDIA/OpenShell.git/git-upload-pack
    binaries:
      - path: /usr/bin/git
  openshell_inference_local:
    name: openshell_inference_local
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/bin/python3
