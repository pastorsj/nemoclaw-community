# Generated by policy-compiler 0.1.0 for understand-openshell. Review before use.
# Boundary (ceiling): the same capabilities without resource scope.
version: 1
network_policies:
  github_rest:
    name: github_rest
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/*/*
          - allow:
              method: GET
              path: /repos/*/*/languages
          - allow:
              method: GET
              path: /repos/*/*/contents/**
          - allow:
              method: GET
              path: /repos/*/*/readme
          - allow:
              method: GET
              path: /repos/*/*/commits
          - allow:
              method: GET
              path: /repos/*/*/commits/*
          - allow:
              method: GET
              path: /repos/*/*/git/trees/*
          - allow:
              method: GET
              path: /repos/*/*/tarball/*
          - allow:
              method: POST
              path: /markdown
    binaries:
      - path: /usr/bin/python3
  github_raw:
    name: github_raw
    endpoints:
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /*/*/*/**
    binaries:
      - path: /usr/bin/python3
  github_codeload:
    name: github_codeload
    endpoints:
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /*/*/legacy.tar.gz/**
    binaries:
      - path: /usr/bin/python3
  github_git:
    name: github_git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /*/*.git/info/refs
          - allow:
              method: POST
              path: /*/*.git/git-upload-pack
    binaries:
      - path: /usr/bin/git
  openshell_inference_local:
    name: openshell_inference_local
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/bin/python3
