version: 1
network_policies:
  nvidia_integrate:
    name: nvidia_integrate
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/bin/python3
  github_rest:
    name: github_rest
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/contents/**
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell/commits
          - allow:
              method: GET
              path: /search/code
    binaries:
      - path: /usr/bin/python3
